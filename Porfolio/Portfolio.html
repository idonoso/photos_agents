<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio fotográfico</title>
<style>
  :root {
    --font-sans: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-display: "Manrope", "Inter", sans-serif;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0d0e10; }
  #root { height: 100%; }
  * { -webkit-font-smoothing: antialiased; }

  .pf-scroll {
    height: 100vh;
    overflow-y: scroll;
    overflow-x: hidden;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .pf-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }

  .pf-sec {
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    position: relative;
    overflow: hidden;
  }

  img { user-select: none; -webkit-user-drag: none; }

  /* Modo "al pasar el ratón": el texto aparece sólo en hover */
  .pf-caption-hover {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .45s ease, transform .45s ease;
    pointer-events: none;
  }
  .pf-hint { opacity: 1; transition: opacity .35s ease; }
  .pf-hovergroup:hover .pf-caption-hover { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .pf-hovergroup:hover .pf-hint { opacity: 0; }

  @media (max-width: 720px) {
    .pf-sec [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  }

  #pf-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0d0e10; color: #6e6d75; font: 400 13px/1 var(--font-sans); letter-spacing: .1em;
  }
</style>
</head>
<body>
<div id="root"><div id="pf-loading">CARGANDO PORTFOLIO…</div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
/* El preview autoriza recursos con un token (?t=…) en la URL del documento.
   Las URLs relativas lo pierden y devuelven 401, así que reconstruimos las
   fuentes y cargamos los .jsx reañadiendo esa query. */
(function () {
  var Q = location.search || '';
  window.__PF_Q = Q;
  var fs = document.createElement('style');
  fs.textContent =
    '@font-face{font-family:"Inter";src:url("fonts/Inter-Variable.ttf' + Q + '") format("truetype-variations");font-weight:100 900;font-style:normal;font-display:swap;}' +
    '@font-face{font-family:"Inter";src:url("fonts/Inter-Italic-Variable.ttf' + Q + '") format("truetype-variations");font-weight:100 900;font-style:italic;font-display:swap;}' +
    '@font-face{font-family:"Manrope";src:url("fonts/Manrope-Variable.ttf' + Q + '") format("truetype-variations");font-weight:200 800;font-style:normal;font-display:swap;}';
  document.head.appendChild(fs);
})();

(async function () {
  var Q = location.search || '';
  var files = ['tweaks-panel.jsx', 'portfolio-data.jsx', 'portfolio.jsx'];
  try {
    var all = '';
    for (var i = 0; i < files.length; i++) {
      var res = await fetch(files[i] + Q);
      if (!res.ok) throw new Error(files[i] + ' → HTTP ' + res.status);
      all += '\n;\n' + (await res.text());
    }
    var out = Babel.transform(all, { presets: ['react'], filename: 'portfolio.jsx' }).code;
    (0, eval)(out);
  } catch (e) {
    console.error(e);
    var el = document.getElementById('root');
    if (el) el.innerHTML = '<pre style="color:#e66;padding:24px;font:13px monospace">' + (e && e.message || e) + '</pre>';
  }
})();
</script>
</body>
</html>
