<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Índice de tarjetas — Portfolio</title>
<style>
  :root {
    --crema: #f4f0e8;
    --tinta: #262220;
    --topo: #8a8175;
    --oro: #b08d57;
    --linea: #e2dcd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--crema);
    color: var(--tinta);
    font: 400 15px/1.5 'Helvetica Neue', Arial, sans-serif;
    padding: 32px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--topo); font-size: 13px; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 10px rgba(30,26,18,0.06); }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--topo); background: #faf8f3; position: sticky; top: 0; }
  tr:hover td { background: #fbf9f4; }
  .idx { color: var(--topo); font-variant-numeric: tabular-nums; width: 36px; }
  .shape { font-weight: 600; }
  .shape-code { display: block; font-size: 11px; color: var(--topo); font-weight: 400; }
  .count { text-align: center; font-variant-numeric: tabular-nums; width: 60px; }
  .titles { }
  .titles ul { margin: 0; padding-left: 18px; }
  .titles li { margin: 2px 0; }
  .cover-row td { background: #fff7e8; font-weight: 600; }
  #err { color: #b33; white-space: pre-wrap; font-family: monospace; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: var(--linea); font-size: 11px; color: var(--tinta); margin-left: 6px; }
</style>
</head>
<body>
<h1>Índice de tarjetas del portfolio</h1>
<div class="sub" id="summary">Cargando…</div>
<div id="err"></div>
<table id="tbl" style="display:none">
  <thead>
    <tr>
      <th class="idx">#</th>
      <th>Forma</th>
      <th class="count">Fotos</th>
      <th class="titles">Título(s)</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
const SHAPE_LABELS = {
  singleStacked: 'Foto única centrada',
  singleSide: 'Foto y texto lateral',
  textForward: 'Cita con foto',
  fullBleedSingle: 'Foto a sangre completa',
  grid2x2: 'Grid 2x2',
  diptychText: 'Díptico con texto',
  filmstrip: 'Tira de miniaturas',
  centeredMinimal: 'Minimalista centrada',
  letterboxStack: 'Dos fotos apiladas',
  heroWithStrip: 'Foto grande con tira',
  polaroidTrio: 'Trío Polaroid',
  asymmetricPair: 'Par asimétrico',
  gridOffset3: 'Grid desplazado (3)',
  circleFocus: 'Foto circular',
  roundedTriptych: 'Tríptico redondeado',
  duo: 'Dos fotos en fila',
  trio: 'Tres fotos en fila',
};

function shapeLabel(type) {
  return SHAPE_LABELS[type] || type;
}

fetch('portfolio-pages.json')
  .then((r) => {
    if (!r.ok) throw new Error('portfolio-pages.json → HTTP ' + r.status);
    return r.json();
  })
  .then((data) => {
    const tbody = document.getElementById('tbody');
    const rows = [];

    if (data.cover) {
      rows.push(`
        <tr class="cover-row">
          <td class="idx">–</td>
          <td class="shape">Portada<span class="shape-code">cover</span></td>
          <td class="count">1</td>
          <td class="titles">${data.cover.title || ''}</td>
        </tr>
      `);
    }

    data.pages.forEach((page, i) => {
      const titles = page.photos.map((p) => p.title || '(sin título)');
      const titlesHtml = titles.length > 1
        ? `<ul>${titles.map((t) => `<li>${t}</li>`).join('')}</ul>`
        : titles[0] || '';
      rows.push(`
        <tr>
          <td class="idx">${i + 1}</td>
          <td class="shape">${shapeLabel(page.type)}<span class="shape-code">${page.type}</span></td>
          <td class="count">${page.photos.length}</td>
          <td class="titles">${titlesHtml}</td>
        </tr>
      `);
    });

    tbody.innerHTML = rows.join('');
    document.getElementById('tbl').style.display = '';

    const totalPhotos = data.pages.reduce((s, p) => s + p.photos.length, 0) + (data.cover ? 1 : 0);
    document.getElementById('summary').textContent =
      `${data.pages.length} tarjetas + portada · ${totalPhotos} fotos en total` +
      (data.generated_at ? ` · generado ${data.generated_at}` : '');
  })
  .catch((e) => {
    document.getElementById('summary').textContent = '';
    document.getElementById('err').textContent = e && e.message || e;
  });
</script>
</body>
</html>
