<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio de fotografía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #e7e2d6; }
  * { box-sizing: border-box; }
  @keyframes lbFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lbZoomIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
  #root { min-height: 100vh; }
  #pf-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #e7e2d6; color: #8a8175; font: 400 13px/1 'Work Sans', sans-serif; letter-spacing: .1em;
  }
</style>
</head>
<body>
<div id="root"><div id="pf-loading">CARGANDO PORTFOLIO…</div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script>
(async function () {
  var files = ['portfolio-data.jsx', 'portfolio-lightbox.jsx', 'portfolio-engine.jsx'];
  try {
    var all = '';
    for (var i = 0; i < files.length; i++) {
      var res = await fetch(files[i]);
      if (!res.ok) throw new Error(files[i] + ' → HTTP ' + res.status);
      all += '\n;\n' + (await res.text());
    }
    var out = Babel.transform(all, { presets: ['react'], filename: 'portfolio.jsx' }).code;
    (0, eval)(out);
  } catch (e) {
    console.error(e);
    var el = document.getElementById('root');
    if (el) el.innerHTML = '<pre style="color:#b33;padding:24px;font:13px monospace">' + (e && e.message || e) + '</pre>';
  }
})();
</script>
</body>
</html>
