<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio fotogr&aacute;fico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      line-height: 1.6;
      padding: 0;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #1c1c1c;
    }
    .site-header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      height: 68px;
      gap: 2rem;
    }
    .site-logo {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      flex-shrink: 0;
    }
    .site-nav {
      display: flex;
      gap: 0.25rem;
      margin-left: auto;
    }
    .site-nav a {
      padding: 0.5rem 1.1rem;
      color: #666;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      font-weight: 500;
    }
    .site-nav a:hover { color: #fff; background: #1a1a1a; }
    .site-nav a.active { color: #fff; background: #1c1c1c; border: 1px solid #2d2d2d; }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .header-sub {
      color: #555;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.02em;
    }
    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-sep {
      width: 1px;
      height: 1.2rem;
      background: #333;
      margin: 0 0.25rem;
    }
    .filter-btn {
      padding: 0.3em 0.7em;
      background: #1a1a1a;
      border: 1px solid #282828;
      border-radius: 4px;
      color: #666;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .filter-btn:hover { border-color: #555; color: #ccc; }
    .filter-btn.active { background: #1a2233; border-color: #4a9eff; color: #4a9eff; }

    .reshoot-badge {
      display: inline-block;
      background: #1a3a1a;
      color: #4caf50;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15em 0.5em;
      border-radius: 3px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    /* --- Card compacta --- */
    .card {
      background: #111;
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
      transition: background 0.2s;
    }
    .card--ref {
      border: 1px solid #d4a017;
      background: #151208;
    }
    .ref-badge {
      display: inline-block;
      background: #d4a017;
      color: #000;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15em 0.5em;
      border-radius: 3px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    .card-compact {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 1rem 1.25rem;
      cursor: pointer;
      user-select: none;
    }
    .card-compact:hover { background: #1a1a1a; }

    .card-thumb {
      width: 150px;
      height: 150px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-info { flex: 1; min-width: 0; }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.2rem;
    }

    .card-desc {
      color: #888;
      font-size: 0.82rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .card-meta {
      display: flex;
      gap: 1.25rem;
      font-size: 0.78rem;
      color: #666;
    }

    .card-parts {
      display: flex;
      gap: 1rem;
      margin-top: 0.6rem;
    }
    .card-part {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
    }
    .card-part-label {
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      font-size: 0.72rem;
    }
    .card-part-score {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .card-score {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      min-width: 56px;
    }

    .score-num {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .score-label {
      font-size: 0.65rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.2rem;
    }

    .card-chevron {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      color: #444;
      transition: transform 0.3s;
    }
    .card.open .card-chevron { transform: rotate(180deg); }

    /* --- Panel expandido --- */
    .card-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }
    .card.open .card-detail { max-height: 8000px; }

    .detail-inner { padding: 0 1.25rem 1.5rem; }

    .detail-photo {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 1.25rem;
    }

    .detail-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .tag {
      background: #1a1a1a;
      color: #999;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
    }
    .tag--cat { color: #fff; background: #222; }

    /* --- Datos de toma --- */
    .exif-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      margin-bottom: 1.25rem;
      padding: 0.85rem 1rem;
      background: #111;
      border-radius: 6px;
    }

    .exif-item {
      display: flex;
      flex-direction: column;
    }

    .exif-label {
      font-size: 0.65rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .exif-value {
      font-size: 0.85rem;
      color: #ccc;
      font-weight: 500;
    }

    /* --- Secciones de evaluacion --- */
    .eval-section { margin-bottom: 1.5rem; }

    .eval-section-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #1e1e1e;
    }

    .eval-section-name {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .eval-section-score {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .eval-section-weight {
      font-size: 0.72rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex: 1;
    }

    .eval-section-header {
      cursor: pointer;
      user-select: none;
    }
    .eval-section-header:hover { opacity: 0.85; }

    .part-chevron {
      width: 16px;
      height: 16px;
      color: #444;
      flex-shrink: 0;
      transition: transform 0.3s;
    }

    .eval-section.part-open .part-chevron {
      transform: rotate(180deg);
    }

    .eval-section-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .eval-section.part-open .eval-section-body {
      max-height: 5000px;
    }

    /* colores por parte */
    .part-tecnica .eval-section-name,
    .part-tecnica .eval-section-score { color: #4a9eff; }
    .part-tecnica .bar-fill { background: #4a9eff; }

    .part-artistica .eval-section-name,
    .part-artistica .eval-section-score { color: #c77dba; }
    .part-artistica .bar-fill { background: #c77dba; }

    .part-excepcional .eval-section-name,
    .part-excepcional .eval-section-score { color: #e8a838; }
    .part-excepcional .bar-fill { background: #e8a838; }

    /* --- Aspecto individual --- */
    .aspect {
      padding: 0.9rem 1rem;
      background: #0e0e0e;
      border-radius: 5px;
      margin-bottom: 0.6rem;
    }

    .aspect-top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .aspect-name {
      font-weight: 600;
      font-size: 0.85rem;
      color: #ccc;
      min-width: 140px;
      flex-shrink: 0;
    }

    .bar {
      flex: 1;
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .aspect-score-num {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      min-width: 28px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .aspect-details {
      display: flex;
      gap: 0.75rem;
    }

    .aspect-comment {
      flex: 1;
      font-size: 0.8rem;
      color: #a5d6a7;
      line-height: 1.5;
      padding: 0.5rem 0.65rem;
      background: #0e1a0e;
      border-left: 2px solid #4caf50;
      border-radius: 3px;
    }

    .aspect-improve {
      flex: 1;
      font-size: 0.8rem;
      color: #e8c87a;
      line-height: 1.5;
      padding: 0.5rem 0.65rem;
      background: #1a160e;
      border-left: 2px solid #e8a838;
      border-radius: 3px;
    }

    /* --- Resumen final --- */
    .eval-summary {
      background: #0e0e0e;
      border-radius: 6px;
      padding: 1.25rem;
      margin-top: 0.5rem;
    }

    .summary-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
    }

    .summary-text {
      font-size: 0.85rem;
      color: #999;
      line-height: 1.6;
      margin-bottom: 0.75rem;
    }

    .summary-row {
      display: flex;
      gap: 2rem;
      margin-bottom: 0.75rem;
      align-items: flex-end;
    }

    .summary-spacer {
      flex: 1;
    }

    .summary-stat {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
    }

    .verdict-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .verdict-box {
      flex: 1;
      padding: 0.85rem 1rem;
      border-radius: 5px;
      font-size: 0.83rem;
      line-height: 1.6;
    }

    .verdict-box--good {
      background: #0e1a0e;
      border-left: 3px solid #4caf50;
      color: #a5d6a7;
    }

    .verdict-box--improve {
      background: #1a160e;
      border-left: 3px solid #e8a838;
      color: #e8c87a;
    }

    .verdict-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
    }

    .verdict-box--good .verdict-label { color: #4caf50; }
    .verdict-box--improve .verdict-label { color: #e8a838; }

    .summary-priority {
      font-size: 0.85rem;
      color: #e8a838;
      line-height: 1.6;
      padding: 0.75rem;
      background: #161310;
      border-radius: 5px;
      border-left: 3px solid #e8a838;
    }

    .priority-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #e8a838;
      margin-bottom: 0.2rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: #444;
    }

    /* --- Secciones por puntuación --- */
    .score-section { margin-bottom: 2rem; }

    .score-section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 0;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #1e1e1e;
      cursor: pointer;
      user-select: none;
    }
    .score-section-header:hover { opacity: 0.8; }

    .score-section-num {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }
    .score-section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
    }
    .score-section-count {
      font-size: 0.72rem;
      color: #555;
      letter-spacing: 0.04em;
      margin-top: 0.1rem;
    }
    .section-chevron {
      width: 20px;
      height: 20px;
      color: #444;
      margin-left: auto;
      flex-shrink: 0;
      transition: transform 0.3s;
    }
    .score-section.open .section-chevron { transform: rotate(180deg); }

    .score-section-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
    }
    .score-section.open .score-section-body { max-height: 200000px; }

    @media (max-width: 640px) {
      .container { padding: 1.5rem 1rem; }
      .card-compact { flex-wrap: wrap; gap: 0.75rem; padding: 0.75rem; }
      .card-thumb { width: 100px; height: 100px; }
      .card-parts { gap: 0.6rem; }
      .aspect-name { min-width: 100px; font-size: 0.8rem; }
      .summary-row { flex-direction: column; gap: 0.75rem; }
      .verdict-row { flex-direction: column; }
      .aspect-details { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-logo" href="index.html">Portfolio fotogr&aacute;fico</a>
      <nav class="site-nav">
        <a href="index.html" class="active">Portfolio</a>
        <a href="mosaico.html">Mosaico</a>
        <a href="tareas.html">Repetir</a>
        <a href="aspectos.html">Aspectos</a>
        <a href="tecnicas.html">T&eacute;cnicas</a>
      </nav>
    </div>
  </header>
  <div class="container">
    <h1>Portfolio</h1>
    <p class="header-sub" id="headerSub"></p>
    <div class="filters" id="filters"></div>
    <div id="gallery"></div>
  </div>

  <script>
    const ASPECT_LABELS = {
      exposicion: 'Exposici\u00f3n',
      nitidez: 'Nitidez',
      color: 'Color',
      balance_blancos: 'Balance de blancos',
      composicion: 'Composici\u00f3n',
      iluminacion: 'Iluminaci\u00f3n',
      enfoque_profundidad: 'Enfoque y profundidad',
      ruido_limpieza: 'Ruido y limpieza',
      procesado: 'Procesado',
      emocion: 'Emoci\u00f3n',
      narrativa: 'Narrativa',
      momento: 'Momento',
      intencion: 'Intenci\u00f3n',
      originalidad: 'Originalidad',
      atmosfera: 'Atm\u00f3sfera',
      conexion: 'Conexi\u00f3n con el sujeto',
      tecnica_emocion: 'T\u00e9cnica + Emoci\u00f3n',
      momento_irrepetible: 'Momento irrepetible',
      estilo_impacto: 'Estilo e impacto',
      trascendencia: 'Trascendencia'
    };

    const PARTS = [
      { key: 'tecnica', name: 'T\u00e9cnica', css: 'part-tecnica', weight: '40%' },
      { key: 'artistica', name: 'Art\u00edstica', css: 'part-artistica', weight: '40%' },
      { key: 'excepcional', name: 'Excepcional', css: 'part-excepcional', weight: '20%' }
    ];

    const SCORE_STOPS = [
      [127, 29, 29],   // 0  #7f1d1d
      [153, 27, 27],   // 1  #991b1b
      [185, 28, 28],   // 2  #b91c1c
      [220, 38, 38],   // 3  #dc2626
      [239, 68, 68],   // 4  #ef4444
      [249, 115, 22],  // 5  #f97316
      [234, 179, 8],   // 6  #eab308
      [132, 204, 22],  // 7  #84cc16
      [16, 185, 129],  // 8  #10b981
      [6, 182, 212],   // 9  #06b6d4
      [37, 99, 235]    // 10 #2563eb
    ];

    function scoreColor(score) {
      if (typeof score !== 'number' || isNaN(score)) return '#888';
      const s = Math.max(0, Math.min(10, score));
      const lo = Math.floor(s);
      const hi = Math.min(10, lo + 1);
      const t = s - lo;
      const [r0, g0, b0] = SCORE_STOPS[lo];
      const [r1, g1, b1] = SCORE_STOPS[hi];
      const r = Math.round(r0 + (r1 - r0) * t);
      const g = Math.round(g0 + (g1 - g0) * t);
      const b = Math.round(b0 + (b1 - b0) * t);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function formatDate(d) {
      if (!d) return 'Sin fecha';
      const [y, m, day] = d.split('-');
      const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
    }

    function renderAspect(key, data, partCss) {
      const pct = (data.puntuacion / 10) * 100;
      return `
        <div class="aspect">
          <div class="aspect-top">
            <span class="aspect-name">${ASPECT_LABELS[key] || key}</span>
            <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="aspect-score-num">${data.puntuacion.toFixed(1)}</span>
          </div>
          <div class="aspect-details">
            <div class="aspect-comment">${data.comentario}</div>
            <div class="aspect-improve">${data.mejora}</div>
          </div>
        </div>`;
    }

    function renderPart(partDef, evalData) {
      const section = evalData[partDef.key];
      if (!section) return '';

      const skipKeys = ['puntuacion_parte', 'lo_bueno', 'lo_mejorable'];
      let aspectsHtml = '';
      for (const [k, v] of Object.entries(section)) {
        if (skipKeys.includes(k)) continue;
        aspectsHtml += renderAspect(k, v, partDef.css);
      }

      const verdictHtml = (section.lo_bueno || section.lo_mejorable) ? `
        <div class="verdict-row">
          ${section.lo_bueno ? `<div class="verdict-box verdict-box--good"><div class="verdict-label">Lo bueno</div>${section.lo_bueno}</div>` : ''}
          ${section.lo_mejorable ? `<div class="verdict-box verdict-box--improve"><div class="verdict-label">Lo mejorable</div>${section.lo_mejorable}</div>` : ''}
        </div>` : '';

      const partId = `${partDef.key}-${Math.random().toString(36).slice(2, 8)}`;
      return `
        <div class="eval-section ${partDef.css}">
          <div class="eval-section-header" onclick="togglePart('${partId}')">
            <span class="eval-section-name">${partDef.name}</span>
            <span class="eval-section-score">${section.puntuacion_parte.toFixed(1)}</span>
            <span class="eval-section-weight">Peso ${partDef.weight}</span>
            <svg class="part-chevron" id="chev-${partId}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="eval-section-body" id="body-${partId}">
            ${verdictHtml}
            ${aspectsHtml}
          </div>
        </div>`;
    }

    const EXIF_LABELS = {
      camara: 'C\u00e1mara', objetivo: 'Objetivo', iso: 'ISO',
      diafragma: 'Diafragma', obturador: 'Obturador', focal: 'Focal',
      compensacion_ev: 'Comp. EV', medicion: 'Medici\u00f3n', balance_blancos: 'Balance blancos'
    };

    function renderExif(datos) {
      if (!datos) return '';
      const items = Object.entries(datos)
        .filter(([, v]) => v !== null && v !== undefined)
        .map(([k, v]) => `<div class="exif-item"><span class="exif-label">${EXIF_LABELS[k] || k}</span><span class="exif-value">${v}</span></div>`)
        .join('');
      return items ? `<div class="exif-row">${items}</div>` : '';
    }

    function renderCard(foto) {
      const ev = foto.evaluacion;
      const total = ev ? ev.puntuacion_total : '—';

      const tagsHtml = (foto.etiquetas || []).map(t => `<span class="tag">${t}</span>`).join('');
      const catHtml = (foto.categorias || []).map(c => `<span class="tag tag--cat">${c}</span>`).join('');

      let partsHtml = '';
      if (ev) {
        PARTS.forEach(p => { partsHtml += renderPart(p, ev); });
      }

      return `
      <div class="card${foto.referencia ? ' card--ref' : ''}" id="card-${foto.nombre}">
        <div class="card-compact" onclick="toggle('card-${foto.nombre}')">
          <img class="card-thumb" src="${foto.path}" alt="${foto.titulo}" loading="lazy">
          <div class="card-info">
            <div class="card-title">${foto.titulo}${foto.referencia ? `<span class="ref-badge">Ref: ${foto.autor}</span>` : ''}${foto.repetir ? '<span class="reshoot-badge">Repetir</span>' : ''}</div>
            <div class="card-desc">${foto.descripcion}</div>
            <div class="card-meta">
              <span>${(foto.categorias || []).join(' / ')}</span>
              <span>${formatDate(foto.fecha)}</span>
              <span>${[foto.lugar, foto.ubicacion].filter(v => v && v !== 'Desconocida').join(', ') || 'Desconocida'}</span>
            </div>
            ${ev ? `<div class="card-parts">
              <div class="card-part"><span class="card-part-label">T\u00e9c</span><span class="card-part-score" style="color:#4a9eff">${ev.tecnica.puntuacion_parte.toFixed(1)}</span></div>
              <div class="card-part"><span class="card-part-label">Art</span><span class="card-part-score" style="color:#c77dba">${ev.artistica.puntuacion_parte.toFixed(1)}</span></div>
              <div class="card-part"><span class="card-part-label">Exc</span><span class="card-part-score" style="color:#e8a838">${ev.excepcional.puntuacion_parte.toFixed(1)}</span></div>
            </div>` : ''}
          </div>
          <div class="card-score">
            <span class="score-num" style="color:${scoreColor(total)}">${typeof total === 'number' ? total.toFixed(1) : total}</span>
            <span class="score-label">Total</span>
          </div>
          <svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="card-detail">
          <div class="detail-inner">
            <img class="detail-photo" src="${foto.path}" alt="${foto.titulo}" loading="lazy">
            <div class="detail-meta-row">
              ${catHtml}
            </div>
            <div class="detail-meta-row">
              ${tagsHtml}
            </div>
            ${renderExif(foto.datos_toma)}
            ${ev ? `
            <div class="eval-summary">
              <div class="summary-row">
                <div class="summary-stat">
                  <span class="stat-label">Total</span>
                  <span class="stat-value" style="color:${scoreColor(ev.puntuacion_total)}">${ev.puntuacion_total.toFixed(1)}</span>
                </div>
                <div class="summary-stat">
                  <span class="stat-label" style="color:#4a9eff">T\u00e9cnica</span>
                  <span class="stat-value" style="color:#4a9eff">${ev.tecnica?.puntuacion_parte?.toFixed(1) ?? '—'}</span>
                </div>
                <div class="summary-stat">
                  <span class="stat-label" style="color:#c77dba">Art\u00edstica</span>
                  <span class="stat-value" style="color:#c77dba">${ev.artistica?.puntuacion_parte?.toFixed(1) ?? '—'}</span>
                </div>
                <div class="summary-stat">
                  <span class="stat-label" style="color:#e8a838">Excepcional</span>
                  <span class="stat-value" style="color:#e8a838">${ev.excepcional?.puntuacion_parte?.toFixed(1) ?? '—'}</span>
                </div>
                <div class="summary-spacer"></div>
                <div class="summary-stat">
                  <span class="stat-label">Potencial</span>
                  <span class="stat-value" style="color:${scoreColor(ev.potencial)}">${ev.potencial.toFixed(1)}</span>
                </div>
                <div class="summary-stat">
                  <span class="stat-label">Margen</span>
                  <span class="stat-value" style="color:#4caf50">+${(ev.potencial - ev.puntuacion_total).toFixed(1)}</span>
                </div>
              </div>
              <div class="summary-title">Resumen general</div>
              ${(ev.lo_bueno || ev.lo_mejorable) ? `
              <div class="verdict-row">
                ${ev.lo_bueno ? `<div class="verdict-box verdict-box--good"><div class="verdict-label">Lo bueno</div>${ev.lo_bueno}</div>` : ''}
                ${ev.lo_mejorable ? `<div class="verdict-box verdict-box--improve"><div class="verdict-label">Lo mejorable</div>${ev.lo_mejorable}</div>` : ''}
              </div>` : ''}
            </div>` : ''}
            ${partsHtml}
          </div>
        </div>
      </div>`;
    }

    function toggle(id) {
      document.getElementById(id).classList.toggle('open');
    }

    function togglePart(partId) {
      const section = document.getElementById('body-' + partId).parentElement;
      section.classList.toggle('part-open');
    }

    function toggleSection(id) {
      document.getElementById(id).classList.toggle('open');
    }

    function renderScoreSection(score, fotos) {
      const color = scoreColor(score);
      const count = fotos.length;
      const cardsHtml = fotos.map(renderCard).join('');
      return `
      <div class="score-section open" id="score-section-${score}">
        <div class="score-section-header" onclick="toggleSection('score-section-${score}')">
          <span class="score-section-num" style="color:${color}">${score}</span>
          <div>
            <div class="score-section-title">Puntuación</div>
            <div class="score-section-count" id="count-section-${score}">${count} foto${count !== 1 ? 's' : ''}</div>
          </div>
          <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="score-section-body">
          ${cardsHtml}
        </div>
      </div>`;
    }

    let allFotos = [];
    let activeUbic = null;
    let activeYear = null;
    let activeCat = null;

    function buildFilters(fotos) {
      const ubics = [...new Set(fotos.map(f => f.ubicacion).filter(u => u && u !== 'Desconocida'))].sort();
      const cats = [...new Set(fotos.flatMap(f => f.categorias || []))].sort();
      const years = [...new Set(fotos.map(f => f.fecha ? f.fecha.split('-')[0] : null).filter(Boolean))].sort().reverse();
      const el = document.getElementById('filters');
      let html = '';
      // Ubicación
      html += `<button class="filter-btn active" data-type="ubic" data-val="">Todos</button>`;
      ubics.forEach(u => { html += `<button class="filter-btn" data-type="ubic" data-val="${u}">${u}</button>`; });
      // Categorías
      if (cats.length > 1) {
        html += `<div class="filter-sep"></div>`;
        html += `<button class="filter-btn active" data-type="cat" data-val="">Todas</button>`;
        cats.forEach(c => { html += `<button class="filter-btn" data-type="cat" data-val="${c}">${c}</button>`; });
      }
      // Años
      if (years.length > 1) {
        html += `<div class="filter-sep"></div>`;
        html += `<button class="filter-btn active" data-type="year" data-val="">Todos</button>`;
        years.forEach(y => { html += `<button class="filter-btn" data-type="year" data-val="${y}">${y}</button>`; });
      }
      el.innerHTML = html;
      el.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const type = btn.dataset.type;
          const val = btn.dataset.val;
          el.querySelectorAll(`.filter-btn[data-type="${type}"]`).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (type === 'ubic') activeUbic = val || null;
          if (type === 'cat') activeCat = val || null;
          if (type === 'year') activeYear = val || null;
          applyFilters();
        });
      });
    }

    function applyFilters() {
      let count = 0;
      document.querySelectorAll('.score-section').forEach(section => {
        let visibleInSection = 0;
        section.querySelectorAll('.card').forEach(card => {
          const nombre = card.id.replace('card-', '');
          const foto = allFotos.find(f => f.nombre === nombre);
          if (!foto) return;
          const matchUbic = !activeUbic || foto.ubicacion === activeUbic;
          const matchCat = !activeCat || (foto.categorias || []).includes(activeCat);
          const matchYear = !activeYear || (foto.fecha && foto.fecha.startsWith(activeYear));
          const show = matchUbic && matchCat && matchYear;
          card.style.display = show ? '' : 'none';
          if (show) visibleInSection++;
        });
        count += visibleInSection;
        section.style.display = visibleInSection > 0 ? '' : 'none';
        const counter = section.querySelector('.score-section-count');
        if (counter) counter.textContent = `${visibleInSection} foto${visibleInSection !== 1 ? 's' : ''}`;
      });
      document.getElementById('headerSub').textContent =
        `${count} de ${allFotos.length} foto${allFotos.length !== 1 ? 's' : ''}`;
    }

    async function init() {
      try {
        const res = await fetch('fotos.json');
        allFotos = await res.json();

        document.getElementById('headerSub').textContent =
          `${allFotos.length} foto${allFotos.length !== 1 ? 's' : ''} evaluada${allFotos.length !== 1 ? 's' : ''}`;

        const gallery = document.getElementById('gallery');
        if (allFotos.length === 0) {
          gallery.innerHTML = '<div class="empty-state">No hay fotos evaluadas todav\u00eda.</div>';
          return;
        }

        allFotos.sort((a, b) => (b.evaluacion?.puntuacion_total || 0) - (a.evaluacion?.puntuacion_total || 0));

        const groups = {};
        allFotos.forEach(foto => {
          const score = foto.evaluacion ? Math.floor(foto.evaluacion.puntuacion_total) : 0;
          if (!groups[score]) groups[score] = [];
          groups[score].push(foto);
        });

        let html = '';
        Object.keys(groups).sort((a, b) => b - a).forEach(score => {
          html += renderScoreSection(parseInt(score), groups[score]);
        });
        gallery.innerHTML = html;
        buildFilters(allFotos);
      } catch (e) {
        document.getElementById('gallery').innerHTML =
          '<div class="empty-state">Error al cargar fotos.json</div>';
      }
    }

    init();
  </script>
</body>
</html>
