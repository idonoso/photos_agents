<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="../image-slot.js"></script>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="{{ cardStyle }}">
    <div style="{{ goRowStyle }}">
      <div style="{{ goBigWrapStyle }}">
        <image-slot id="go-big-tpl" src="https://picsum.photos/seed/tpl-go-big/900/900" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto grande"></image-slot>
      </div>
      <div style="{{ goSmallColStyle }}">
        <div style="{{ goSmallWrapStyle }}">
          <image-slot id="go-s1-tpl" src="https://picsum.photos/seed/tpl-go-s1/500/500" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto pequeña 1"></image-slot>
        </div>
        <div style="{{ goSmallWrapStyle }}">
          <image-slot id="go-s2-tpl" src="https://picsum.photos/seed/tpl-go-s2/500/500" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto pequeña 2"></image-slot>
        </div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1264, &quot;height&quot;: 739}}">
// TIPO DE PÁGINA: Grid desplazado (3 fotos) — una foto grande a la izquierda
// y dos apiladas a la derecha, sin texto. Puramente visual.
class Component extends DCLogic {
  bigRatio = 1;
  s1Ratio = 1.5;

  renderVals() {
    const cardW = 1200, cardH = 675, padX = 60, padY = 52;
    const contentW = cardW - padX * 2;
    const shadow = '0 26px 56px rgba(30,26,18,0.18), 0 4px 12px rgba(30,26,18,0.09)';
    const border = '1px solid rgba(30,26,18,0.1)';
    const rowH = 460;
    let bw = rowH * this.bigRatio, bh = rowH;
    const maxBw = Math.round(contentW * 0.5);
    if (bw > maxBw) { bw = maxBw; bh = bw / this.bigRatio; }
    const smallH = Math.round((rowH - 20) / 2);

    return {
      wrapStyle: { display: 'flex', justifyContent: 'center', background: '#e7e2d6', padding: 32 },
      cardStyle: { background: 'linear-gradient(150deg, #faf6ec 0%, #f1ead6 100%)', border, boxShadow: shadow, borderRadius: 8, width: cardW, height: cardH, boxSizing: 'border-box', padding: `${padY}px ${padX}px`, display: 'flex', flexDirection: 'column', justifyContent: 'center', overflow: 'hidden', position: 'relative' },
      goRowStyle: { display: 'flex', flexDirection: 'row', gap: 20, justifyContent: 'center' },
      goBigWrapStyle: { width: Math.round(bw), height: Math.round(bh), position: 'relative', overflow: 'hidden', background: 'rgba(20,16,10,0.045)' },
      goSmallColStyle: { display: 'flex', flexDirection: 'column', gap: 20, width: Math.round(smallH * this.s1Ratio) },
      goSmallWrapStyle: { width: '100%', height: smallH, position: 'relative', overflow: 'hidden', background: 'rgba(20,16,10,0.045)' }
    };
  }
}

</script>
</body>
</html>
