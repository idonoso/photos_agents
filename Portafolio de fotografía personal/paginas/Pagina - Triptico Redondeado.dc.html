<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500&display=swap" rel="stylesheet">
  <script src="../image-slot.js"></script>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="{{ cardStyle }}">
    <div style="{{ rtRowStyle }}">
      <sc-for list="{{ photos }}" as="ph" hint-placeholder-count="3">
        <div>
          <div style="{{ ph.rtWrapStyle }}">
            <image-slot id="{{ ph.slotId }}" src="{{ ph.src }}" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto"></image-slot>
          </div>
          <div style="{{ ph.rtTitleStyle }}">{{ ph.title }}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1264, &quot;height&quot;: 739}}">
// TIPO DE PÁGINA: Tríptico redondeado — tres fotos cuadradas con esquinas
// redondeadas, cada una con un título corto debajo.
class Component extends DCLogic {
  items = [
    { slotId: 'rt1', title: 'Uno' },
    { slotId: 'rt2', title: 'Dos' },
    { slotId: 'rt3', title: 'Tres' }
  ];

  renderVals() {
    const fg = '#262220';
    const serifFont = "'Playfair Display', serif";
    const cardW = 1200, cardH = 675, padX = 60, padY = 52;
    const shadow = '0 26px 56px rgba(30,26,18,0.18), 0 4px 12px rgba(30,26,18,0.09)';
    const border = '1px solid rgba(30,26,18,0.1)';
    const rtWrapStyle = { width: 210, height: 210, position: 'relative', overflow: 'hidden', borderRadius: 18, background: 'rgba(20,16,10,0.045)' };
    const rtTitleStyle = { fontFamily: serifFont, fontSize: 17, color: fg, textAlign: 'center', marginTop: 12 };

    return {
      wrapStyle: { display: 'flex', justifyContent: 'center', background: '#e7e2d6', padding: 32 },
      cardStyle: { background: 'linear-gradient(150deg, #faf6ec 0%, #f1ead6 100%)', border, boxShadow: shadow, borderRadius: 8, width: cardW, height: cardH, boxSizing: 'border-box', padding: `${padY}px ${padX}px`, display: 'flex', flexDirection: 'column', justifyContent: 'center', overflow: 'hidden', position: 'relative' },
      rtRowStyle: { display: 'flex', justifyContent: 'center', gap: 34 },
      photos: this.items.map(it => ({ ...it, src: `https://picsum.photos/seed/tpl-${it.slotId}/500/500`, rtWrapStyle, rtTitleStyle }))
    };
  }
}

</script>
</body>
</html>
