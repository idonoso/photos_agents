<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="../image-slot.js"></script>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="{{ cardStyle }}">
    <div style="{{ filmHeaderStyle }}">Cuaderno de campo</div>
    <div style="{{ filmRowStyle }}">
      <sc-for list="{{ photos }}" as="ph" hint-placeholder-count="5">
        <div style="{{ ph.thumbStyle }}">
          <image-slot id="{{ ph.slotId }}" src="{{ ph.src }}" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto"></image-slot>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1264, &quot;height&quot;: 739}}">
// TIPO DE PÁGINA: Tira de miniaturas — 5 fotos cuadradas en fila, bajo un
// título de sección. Bueno para series cortas o "detrás de cámara".
class Component extends DCLogic {
  seeds = ['f1', 'f2', 'f3', 'f4', 'f5'];

  renderVals() {
    const fg = '#262220';
    const serifFont = "'Playfair Display', serif";
    const cardW = 1200, cardH = 675, padX = 60, padY = 52;
    const shadow = '0 26px 56px rgba(30,26,18,0.18), 0 4px 12px rgba(30,26,18,0.09)';
    const border = '1px solid rgba(30,26,18,0.1)';
    const thumbStyle = { width: 168, height: 168, position: 'relative', overflow: 'hidden', background: 'rgba(20,16,10,0.045)' };

    return {
      wrapStyle: { display: 'flex', justifyContent: 'center', background: '#e7e2d6', padding: 32 },
      cardStyle: { background: 'linear-gradient(150deg, #faf6ec 0%, #f1ead6 100%)', border, boxShadow: shadow, borderRadius: 8, width: cardW, height: cardH, boxSizing: 'border-box', padding: `${padY}px ${padX}px`, display: 'flex', flexDirection: 'column', justifyContent: 'center', overflow: 'hidden', position: 'relative' },
      filmHeaderStyle: { fontFamily: serifFont, fontStyle: 'italic', fontSize: 26, color: fg, textAlign: 'center', marginBottom: 26 },
      filmRowStyle: { display: 'flex', justifyContent: 'center', gap: 20 },
      photos: this.seeds.map(s => ({ slotId: `tpl-${s}`, src: `https://picsum.photos/seed/tpl-${s}/500/500`, thumbStyle }))
    };
  }
}

</script>
</body>
</html>
