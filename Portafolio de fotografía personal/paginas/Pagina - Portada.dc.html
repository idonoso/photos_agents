<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="../image-slot.js"></script>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="{{ cardStyle }}">
    <div style="{{ imgWrapStyle }}">
      <image-slot id="cover-tpl" src="https://picsum.photos/seed/tpl-cover/1200/750" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto de portada, panorámica"></image-slot>
    </div>
    <div style="{{ scrimStyle }}"></div>
    <div style="{{ textStyle }}">
      <div style="{{ titleStyle }}">Elena Rivas</div>
      <div style="{{ taglineStyle }}">Fotografía</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1264, &quot;height&quot;: 739}}">
// TIPO DE PÁGINA: Portada — una sola foto a sangre completa con el título del
// portafolio fusionado sobre la imagen (degradado inferior para legibilidad).
class Component extends DCLogic {
  renderVals() {
    const serifFont = "'Playfair Display', serif";
    const sansFont = "'Work Sans', sans-serif";
    const cardW = 1200, cardH = 675;
    const shadow = '0 26px 56px rgba(30,26,18,0.18), 0 4px 12px rgba(30,26,18,0.09)';
    const border = '1px solid rgba(30,26,18,0.1)';
    return {
      wrapStyle: { display: 'flex', justifyContent: 'center', background: '#e7e2d6', padding: 32 },
      cardStyle: { background: '#12100c', border, boxShadow: shadow, borderRadius: 8, width: cardW, height: cardH, boxSizing: 'border-box', padding: 0, overflow: 'hidden', position: 'relative' },
      imgWrapStyle: { position: 'absolute', inset: 0, width: '100%', height: '100%' },
      scrimStyle: { position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(10,8,6,0.05) 0%, rgba(10,8,6,0.18) 45%, rgba(10,8,6,0.65) 100%)' },
      textStyle: { position: 'absolute', left: 0, right: 0, bottom: '10%', textAlign: 'center', padding: '0 32px' },
      titleStyle: { fontFamily: serifFont, fontStyle: 'italic', fontWeight: 500, fontSize: 68, color: '#f8f5ee', textShadow: '0 4px 24px rgba(0,0,0,0.35)', letterSpacing: '.01em' },
      taglineStyle: { fontFamily: sansFont, fontSize: 14, letterSpacing: '.24em', textTransform: 'uppercase', color: '#f0ece0', opacity: 0.88, marginTop: 12 }
    };
  }
}

</script>
</body>
</html>
