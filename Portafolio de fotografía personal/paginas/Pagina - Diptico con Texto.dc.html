<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="../image-slot.js"></script>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="{{ cardStyle }}">
    <div style="{{ rowStyle }}">
      <div>
        <div style="{{ dtImgStyle }}">
          <image-slot id="dt-left-tpl" src="https://picsum.photos/seed/tpl-dt1/800/1111" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto izquierda"></image-slot>
        </div>
        <div style="{{ dtLabelStyle }}">Lugar izquierda</div>
      </div>
      <div style="{{ dtCenterStyle }}">
        <div style="{{ dtTitleStyle }}">Título de la serie</div>
        <div style="{{ dtNotesStyle }}">Nota que conecta ambas fotos, colocada en el centro entre las dos imágenes.</div>
      </div>
      <div>
        <div style="{{ dtImgStyle }}">
          <image-slot id="dt-right-tpl" src="https://picsum.photos/seed/tpl-dt2/800/1111" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto derecha"></image-slot>
        </div>
        <div style="{{ dtLabelStyle }}">Lugar derecha</div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1264, &quot;height&quot;: 739}}">
// TIPO DE PÁGINA: Díptico con texto — dos fotos verticales a los lados,
// con el título y una nota centrados entre ambas.
class Component extends DCLogic {
  renderVals() {
    const fg = '#262220', muted = '#8a8175';
    const sansFont = "'Work Sans', sans-serif";
    const serifFont = "'Playfair Display', serif";
    const cardW = 1200, cardH = 675, padX = 60, padY = 52;
    const shadow = '0 26px 56px rgba(30,26,18,0.18), 0 4px 12px rgba(30,26,18,0.09)';
    const border = '1px solid rgba(30,26,18,0.1)';
    const dtBoxH = 420;

    return {
      wrapStyle: { display: 'flex', justifyContent: 'center', background: '#e7e2d6', padding: 32 },
      cardStyle: { background: 'linear-gradient(150deg, #faf6ec 0%, #f1ead6 100%)', border, boxShadow: shadow, borderRadius: 8, width: cardW, height: cardH, boxSizing: 'border-box', padding: `${padY}px ${padX}px`, display: 'flex', flexDirection: 'column', justifyContent: 'center', overflow: 'hidden', position: 'relative' },
      rowStyle: { display: 'flex', flexDirection: 'row', gap: 40, alignItems: 'center' },
      dtImgStyle: { height: dtBoxH, width: Math.round(dtBoxH * 0.72), position: 'relative', overflow: 'hidden', background: 'rgba(20,16,10,0.045)' },
      dtLabelStyle: { fontFamily: sansFont, fontSize: 12, letterSpacing: '.04em', color: muted, marginTop: 8, textAlign: 'center' },
      dtCenterStyle: { flex: 1, textAlign: 'center', padding: '0 12px' },
      dtTitleStyle: { fontFamily: serifFont, fontStyle: 'italic', fontSize: 30, color: fg, lineHeight: 1.3 },
      dtNotesStyle: { fontFamily: serifFont, fontStyle: 'italic', fontSize: 16, color: fg, opacity: 0.75, marginTop: 12, lineHeight: 1.5 }
    };
  }
}

</script>
</body>
</html>
