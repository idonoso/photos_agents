<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="../image-slot.js"></script>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="{{ cardStyle }}">
    <div style="{{ rowStyle }}">
      <sc-for list="{{ photos }}" as="ph" hint-placeholder-count="2">
        <div style="{{ ph.itemStyle }}">
          <div style="{{ ph.frameStyle }}">
            <image-slot id="{{ ph.slotId }}" src="{{ ph.src }}" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto"></image-slot>
          </div>
          <div style="{{ ph.capStyle }}">
            <div style="{{ ph.itemTitleStyle }}">{{ ph.title }}</div>
            <div style="{{ ph.itemMetaStyle }}">{{ ph.place }} · {{ ph.date }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1264, &quot;height&quot;: 739}}">
// TIPO DE PÁGINA: Dos fotos en fila — fila "justificada" de 2 fotos
// (mezcla horizontal/vertical), cada una con título y lugar/fecha.
// La altura de la fila se ajusta para que quepan siempre en una sola línea.
class Component extends DCLogic {
  photos = [
    { slotId: 'd1', title: 'Foto uno', place: 'Lugar', date: 'Fecha', ratio: 1.5, src: 'https://picsum.photos/seed/tpl-d1/900/600' },
    { slotId: 'd2', title: 'Foto dos', place: 'Lugar', date: 'Fecha', ratio: 0.75, src: 'https://picsum.photos/seed/tpl-d2/900/1200' }
  ];

  renderVals() {
    const fg = '#262220', muted = '#8a8175';
    const sansFont = "'Work Sans', sans-serif";
    const serifFont = "'Playfair Display', serif";
    const cardW = 1200, cardH = 675, padX = 60, padY = 52;
    const contentW = cardW - padX * 2;
    const shadow = '0 26px 56px rgba(30,26,18,0.18), 0 4px 12px rgba(30,26,18,0.09)';
    const border = '1px solid rgba(30,26,18,0.1)';

    const baseRowH = 360;
    const gap = 22;
    const totalNaturalW = this.photos.reduce((s, p) => s + baseRowH * p.ratio, 0);
    const totalGap = gap * (this.photos.length - 1);
    const scale = Math.min(1, (contentW - totalGap) / totalNaturalW);
    const rowH = Math.round(baseRowH * scale);

    const items = this.photos.map(p => ({
      ...p,
      itemStyle: { width: Math.round(rowH * p.ratio), flex: 'none', display: 'flex', flexDirection: 'column' },
      frameStyle: { position: 'relative', height: rowH, width: '100%', overflow: 'hidden', background: 'rgba(20,16,10,0.045)' },
      capStyle: { padding: '10px 2px 0' },
      itemTitleStyle: { fontFamily: serifFont, fontSize: 24, color: fg, margin: 0, lineHeight: 1.25 },
      itemMetaStyle: { fontFamily: sansFont, fontSize: 12.5, letterSpacing: '.02em', color: muted, marginTop: 5 }
    }));

    return {
      wrapStyle: { display: 'flex', justifyContent: 'center', background: '#e7e2d6', padding: 32 },
      cardStyle: { background: 'linear-gradient(150deg, #faf6ec 0%, #f1ead6 100%)', border, boxShadow: shadow, borderRadius: 8, width: cardW, height: cardH, boxSizing: 'border-box', padding: `${padY}px ${padX}px`, display: 'flex', flexDirection: 'column', justifyContent: 'center', overflow: 'hidden', position: 'relative' },
      rowStyle: { display: 'flex', flexWrap: 'nowrap', alignItems: 'flex-start', justifyContent: 'center', gap: `${gap}px` },
      photos: items
    };
  }
}

</script>
</body>
</html>
