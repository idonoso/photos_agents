<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="../image-slot.js"></script>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="{{ cardStyle }}">
    <div style="{{ fbImgWrapStyle }}">
      <image-slot id="fb-tpl" src="https://picsum.photos/seed/tpl-fb/1000/1000" style="width:100%;height:100%;display:block" shape="rect" fit="cover" placeholder="Foto que llena toda la página"></image-slot>
    </div>
    <div style="{{ fbScrimStyle }}"></div>
    <div style="{{ fbTextStyle }}">
      <div style="{{ fbTitleStyle }}">Título de la foto</div>
      <div style="{{ fbMetaStyle }}">Lugar · Fecha</div>
      <div style="{{ fbNotesStyle }}">Nota larga sobre la foto, superpuesta con degradado para mantener la legibilidad.</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1264, &quot;height&quot;: 739}}">
// TIPO DE PÁGINA: Foto a sangre completa — la foto llena toda la tarjeta
// (recortada), con título/lugar/nota superpuestos abajo con degradado.
class Component extends DCLogic {
  renderVals() {
    const serifFont = "'Playfair Display', serif";
    const sansFont = "'Work Sans', sans-serif";
    const cardW = 1200, cardH = 675;
    const shadow = '0 26px 56px rgba(30,26,18,0.18), 0 4px 12px rgba(30,26,18,0.09)';
    const border = '1px solid rgba(30,26,18,0.1)';
    return {
      wrapStyle: { display: 'flex', justifyContent: 'center', background: '#e7e2d6', padding: 32 },
      cardStyle: { background: '#12100c', border, boxShadow: shadow, borderRadius: 8, width: cardW, height: cardH, boxSizing: 'border-box', padding: 0, overflow: 'hidden', position: 'relative' },
      fbImgWrapStyle: { position: 'absolute', inset: 0, width: '100%', height: '100%' },
      fbScrimStyle: { position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(10,8,6,0) 55%, rgba(10,8,6,0.6) 100%)' },
      fbTextStyle: { position: 'absolute', left: 0, right: 0, bottom: 0, padding: '0 44px 34px', textAlign: 'left' },
      fbTitleStyle: { fontFamily: serifFont, fontStyle: 'italic', fontSize: 38, color: '#faf6ef', textShadow: '0 3px 16px rgba(0,0,0,0.35)' },
      fbMetaStyle: { fontFamily: sansFont, fontSize: 14, letterSpacing: '.06em', color: '#e7e0d2', marginTop: 6, opacity: 0.9 },
      fbNotesStyle: { fontFamily: serifFont, fontStyle: 'italic', fontSize: 17, color: '#f2ede2', opacity: 0.92, marginTop: 14, lineHeight: 1.55, maxWidth: 520, textShadow: '0 2px 10px rgba(0,0,0,0.3)' }
    };
  }
}

</script>
</body>
</html>
