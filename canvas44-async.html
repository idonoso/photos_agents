<!DOCTYPE html>
<html>
<body style="background:#111;display:flex;gap:20px;padding:20px;flex-wrap:wrap" id="out">
<script>
const photos = [
  { src: 'http://localhost:8765/originales/DSC_2478.jpeg', title: 'Ganso del Nilo' },
  { src: 'http://localhost:8765/originales/DSC_4452.jpeg', title: 'Desde su trono' },
  { src: 'http://localhost:8765/originales/DSC_3609.jpeg', title: 'Velocidad y quietud' },
];

let done = 0;
photos.forEach(p => {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    // Canvas 44x44 (lo que usa el código)
    const s = 44;
    const cv = document.createElement('canvas');
    cv.width = s; cv.height = s;
    const cx = cv.getContext('2d');
    cx.drawImage(img, 0, 0, s, s);

    // Calcular color medio
    const d = cx.getImageData(0, 0, s, s).data;
    let r = 0, g = 0, b = 0, n = 0;
    for (let k = 0; k < d.length; k += 4) { r += d[k]; g += d[k+1]; b += d[k+2]; n++; }
    const avg = { r: Math.round(r/n), g: Math.round(g/n), b: Math.round(b/n) };
    const hex = '#' + [avg.r, avg.g, avg.b].map(v => v.toString(16).padStart(2,'0')).join('');

    // Ampliar a 400x400 pixelado
    const big = document.createElement('canvas');
    big.width = 400; big.height = 400;
    const bx = big.getContext('2d');
    bx.imageSmoothingEnabled = false;
    bx.drawImage(cv, 0, 0, 400, 400);

    const div = document.createElement('div');
    div.style = 'text-align:center';
    div.innerHTML = `
      <img src="${big.toDataURL()}" width="400" height="400" style="image-rendering:pixelated;display:block">
      <div style="width:400px;height:40px;background:${hex}"></div>
      <p style="color:white;font-family:sans-serif;font-size:12px;margin:4px 0">${p.title}</p>
      <p style="color:#888;font-family:monospace;font-size:11px;margin:0">color medio: ${hex} · rgb(${avg.r},${avg.g},${avg.b})</p>
    `;
    document.getElementById('out').appendChild(div);
    if (++done === photos.length) document.title = 'READY';
  };
  img.src = p.src;
});
</script>
</body>
</html>
